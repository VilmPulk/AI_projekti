<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="pauseButton" type="button" aria-pressed="false" disabled>Pause</button>
        <div id="startScreen" class="game-screen">
            <h2>Snake</h2>
            <button id="startButton" type="button">Start</button>
        </div>
        <div id="pauseScreen" class="game-screen" hidden>
            <h2>Paused</h2>
            <button id="resumeButton" type="button">Resume</button>
        </div>
        <div id="gameOverScreen" class="game-screen" hidden>
            <h2 id="gameOverTitle">Game over!</h2>
            <p id="finalScore"></p>
            <button id="replayButton" type="button">Replay</button>
        </div>
    </div>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const info = document.getElementById("info");
        const replayButton = document.getElementById("replayButton");
        const pauseButton = document.getElementById("pauseButton");
        const startButton = document.getElementById("startButton");
        const resumeButton = document.getElementById("resumeButton");
        const startScreen = document.getElementById("startScreen");
        const pauseScreen = document.getElementById("pauseScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const gameOverTitle = document.getElementById("gameOverTitle");
        const finalScore = document.getElementById("finalScore");
        const startingSpeed = 250;
        const minimumSpeed = 80;
        const speedIncrease = 15;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameSpeed = startingSpeed;
        let gameInterval;
        let isStarted = false;
        let isPaused = false;
        let isGameOver = false;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);
            for (let row = 0; row < tileCount; row++) {
                for (let column = 0; column < tileCount; column++) {
                    ctx.fillStyle = (row + column) % 2 === 0 ? "#aad751" : "#a2d149";
                    ctx.fillRect(
                        column * gridSize,
                        row * gridSize,
                        gridSize,
                        gridSize
                    );
                }
            }

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "#4b2e1f";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        const endGame = (message = "Game over!") => {
            isGameOver = true;
            isPaused = false;
            pauseButton.disabled = true;
            pauseButton.textContent = "Pause";
            pauseButton.setAttribute("aria-pressed", "false");
            gameOverTitle.textContent = message;
            finalScore.textContent = `Final score: ${score}`;
            gameOverScreen.hidden = false;
            clearInterval(gameInterval);
        };

        const startGameLoop = () => {
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        };

        const startGame = () => {
            isStarted = true;
            startScreen.hidden = true;
            pauseButton.disabled = false;
            startGameLoop();
        };

        const resumeGame = () => {
            isPaused = false;
            pauseScreen.hidden = true;
            pauseButton.textContent = "Pause";
            pauseButton.setAttribute("aria-pressed", "false");
            startGameLoop();
        };

        const moveSnake = () => {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            const eatingFood = head.x === food.x && head.y === food.y;

            if (
                head.x < 0 || head.x >= tileCount ||
                head.y < 0 || head.y >= tileCount
            ) {
                endGame();
                return;
            }

            const bodyToCheck = snake.slice(0, eatingFood ? snake.length : -1);
            if (bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (eatingFood) {
                score++;
                info.textContent = `Score: ${score}`;
                gameSpeed = Math.max(minimumSpeed, gameSpeed - speedIncrease);
                if (!placeFood()) {
                    endGame("You win!");
                    return;
                }
                startGameLoop();
            } else {
                snake.pop();
            }
        };

        const placeFood = () => {
            const emptyTiles = [];
            for (let row = 0; row < tileCount; row++) {
                for (let column = 0; column < tileCount; column++) {
                    if (!snake.some(segment => segment.x === column && segment.y === row)) {
                        emptyTiles.push({ x: column, y: row });
                    }
                }
            }

            if (emptyTiles.length === 0) return false;

            food = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
            return true;
        };

        const gameLoop = () => {
            moveSnake();
            drawGame();
        };

        startButton.addEventListener("click", startGame);

        replayButton.addEventListener("click", () => {
            clearInterval(gameInterval);
            isStarted = true;
            isPaused = false;
            isGameOver = false;
            gameSpeed = startingSpeed;
            pauseButton.disabled = false;
            pauseButton.textContent = "Pause";
            pauseButton.setAttribute("aria-pressed", "false");
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            info.textContent = "";
            gameOverTitle.textContent = "Game over!";
            gameOverScreen.hidden = true;
            drawGame();
            startGameLoop();
        });

        resumeButton.addEventListener("click", resumeGame);

        pauseButton.addEventListener("click", () => {
            if (!isStarted || isGameOver) return;

            isPaused = !isPaused;
            pauseButton.textContent = isPaused ? "Resume" : "Pause";
            pauseButton.setAttribute("aria-pressed", String(isPaused));

            if (isPaused) {
                clearInterval(gameInterval);
                pauseScreen.hidden = false;
            } else {
                resumeGame();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (!isStarted || isPaused || isGameOver) return;

            switch (event.key) {
                case "ArrowUp":
                    if (direction.y === 0) direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) direction = { x: 1, y: 0 };
                    break;
            }
        });

    </script>

</body>
</html>
