<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="pauseButton" type="button" aria-pressed="false">Pause</button>
        <div id="gameOverScreen" class="game-over-screen" hidden>
            <h2>Game over!</h2>
            <p id="finalScore"></p>
            <button id="replayButton" type="button">Replay</button>
        </div>
    </div>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const info = document.getElementById("info");
        const replayButton = document.getElementById("replayButton");
        const pauseButton = document.getElementById("pauseButton");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const finalScore = document.getElementById("finalScore");

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameInterval;
        let isPaused = false;
        let isGameOver = false;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);
            for (let row = 0; row < tileCount; row++) {
                for (let column = 0; column < tileCount; column++) {
                    ctx.fillStyle = (row + column) % 2 === 0 ? "#aad751" : "#a2d149";
                    ctx.fillRect(
                        column * gridSize,
                        row * gridSize,
                        gridSize,
                        gridSize
                    );
                }
            }

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "#4b2e1f";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        const endGame = () => {
            isGameOver = true;
            isPaused = false;
            pauseButton.disabled = true;
            pauseButton.textContent = "Pause";
            pauseButton.setAttribute("aria-pressed", "false");
            finalScore.textContent = `Final score: ${score}`;
            gameOverScreen.hidden = false;
            clearInterval(gameInterval);
        };

        const moveSnake = () => {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            const eatingFood = head.x === food.x && head.y === food.y;

            if (
                head.x < 0 || head.x >= tileCount ||
                head.y < 0 || head.y >= tileCount
            ) {
                endGame();
                return;
            }

            const bodyToCheck = snake.slice(0, eatingFood ? snake.length : -1);
            if (bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (eatingFood) {
                score++;
                info.textContent = `Score: ${score}`;
                placeFood();
            } else {
                snake.pop();
            }
        };

        const placeFood = () => {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        };

        const gameLoop = () => {
            moveSnake();
            drawGame();
        };

        replayButton.addEventListener("click", () => {
            clearInterval(gameInterval);
            isPaused = false;
            isGameOver = false;
            pauseButton.disabled = false;
            pauseButton.textContent = "Pause";
            pauseButton.setAttribute("aria-pressed", "false");
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            info.textContent = "";
            gameOverScreen.hidden = true;
            drawGame();
            gameInterval = setInterval(gameLoop, 100);
        });

        pauseButton.addEventListener("click", () => {
            if (isGameOver) return;

            isPaused = !isPaused;
            pauseButton.textContent = isPaused ? "Resume" : "Pause";
            pauseButton.setAttribute("aria-pressed", String(isPaused));

            if (isPaused) {
                clearInterval(gameInterval);
            } else {
                gameInterval = setInterval(gameLoop, 100);
            }
        });

        gameInterval = setInterval(gameLoop, 100);

        document.addEventListener("keydown", (event) => {
            switch (event.key) {
                case "ArrowUp":
                    if (direction.y === 0) direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) direction = { x: 1, y: 0 };
                    break;
            }
        });

    </script>

</body>
</html>
